name: 功能建议
description: 想要的新能力或改进
title: '[Feature] '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述你遇到的场景，而不是只写想要的功能 —— 知道场景才可能给出更好的方案
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你设想它应该怎么工作；如果还没想清楚，留空也可以
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 属于哪一块
      options:
        - 代理 / 页面重写
        - Agent 能力（动作、规划、多步任务）
        - 隔离与登录态
        - 面板 UI / 交互
        - 部署与运维（Docker、CI、配置）
        - 文档 / 测试
        - 其他
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 以及为什么它们不够好
    validations:
      required: false
