name: Release

# 打 tag 即发布镜像：git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 镜像标签（例如 v1.0.0 或 1.0.0）
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish-image:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 推导镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            # 正式 tag 推送：v1.0.0 → 1.0.0 / 1.0 / 1 / latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # latest 只由 tag 推送产生。这里不能加 is_default_branch 条件：
            # tag 推送时 github.ref 是 refs/tags/...，该判断为 false，
            # 会导致 latest 缺失，下面的发布后验证也就拉不到镜像。
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
            # 手动触发（workflow_dispatch）时用输入的标签
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------
  # 发布后自证：从 GHCR 把刚推上去的镜像拉回来真跑一遍，
  # 确认健康检查通过 —— 避免「构建成功但容器起不来」被漏过
  # ---------------------------------------------------------------
  verify-image:
    name: 发布后验证
    runs-on: ubuntu-latest
    needs: publish-image
    steps:
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 拉取并启动
        run: |
          docker pull "$IMAGE:latest"
          docker run -d --name wap -p 3000:3000 "$IMAGE:latest"

      - name: 等待健康检查
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' wap)
            echo "health=$status"
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          echo '健康检查未通过：'
          docker logs wap
          exit 1

      - name: 首页可达性
        run: |
          curl -fsS -o /dev/null -w 'index=%{http_code}\n' http://127.0.0.1:3000/
          curl -fsS http://127.0.0.1:3000/api/health | head -c 300; echo

      - name: 容器日志
        if: failure()
        run: docker logs wap || true

  # ---------------------------------------------------------------
  # 建 Release：镜像验证通过后再发，避免指向起不来的镜像。
  # 说明优先用 CHANGELOG 里对应版本段落，找不到则退回 GitHub 自动生成。
  # ---------------------------------------------------------------
  create-release:
    name: 创建 GitHub Release
    runs-on: ubuntu-latest
    needs: verify-image
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 提取 CHANGELOG 对应版本段落
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 - <<'PY' > release-notes.md
          import os, re
          ref = os.environ.get('GITHUB_REF_NAME', '')
          version = ref[1:] if ref.startswith('v') else ref
          text = open('CHANGELOG.md', encoding='utf-8').read()
          pat = re.compile(r'## \[' + re.escape(version) + r'\].*?(?=\n## \[|\Z)', re.S)
          m = pat.search(text)
          out = m.group(0).strip() if m else ''
          out = re.sub(r'\n\[' + re.escape(version) + r'\]:.*$', '', out, flags=re.S).strip()
          print(out)
          PY
          if [ -s release-notes.md ]; then
            echo "auto=0" >> "$GITHUB_OUTPUT"
            echo "找到 CHANGELOG ${version} 段落，用作 Release 说明"
          else
            echo "auto=1" >> "$GITHUB_OUTPUT"
            echo "未在 CHANGELOG 找到 ${version} 段落，改用自动生成说明"
            rm -f release-notes.md
          fi

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ steps.notes.outputs.auto == '0' && 'release-notes.md' || '' }}
          generate_release_notes: ${{ steps.notes.outputs.auto == '1' }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
