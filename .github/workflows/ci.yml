name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# 同一分支上连续推送时取消旧任务，省掉无谓的排队
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------
  # 1) 语法检查：最快的一道关，失败就不必往下跑
  # ---------------------------------------------------------------
  syntax:
    name: 语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: node scripts/check-syntax.mjs

  # ---------------------------------------------------------------
  # 2) 核心回归：不需要浏览器，只用服务端 + 夹具
  #    覆盖请求头清洗、超时重试、DNS rebinding 防护
  # ---------------------------------------------------------------
  core:
    name: 核心回归（无浏览器）
    runs-on: ubuntu-latest
    needs: syntax
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: 启动服务
        run: |
          set -u
          # 3211：常规实例（夹具在 127.0.0.1，需开 ALLOW_LOCALHOST）
          ALLOW_LOCALHOST=true PORT=3211 node server/index.js >/tmp/app-3211.log 2>&1 &
          # 3214：短超时实例，专门测超时与重试的时序约束
          PORT=3214 ALLOW_LOCALHOST=true PROXY_TIMEOUT_MS=1200 PROXY_RETRY=1 CONNECT_TIMEOUT_MS=3000 \
            node server/index.js >/tmp/app-3214.log 2>&1 &
          node scripts/fixtures/fixtures-server.mjs >/tmp/fixtures.log 2>&1 &
          node scripts/fixtures/ws-echo-server.mjs >/tmp/ws-echo.log 2>&1 &

          wait_port() {
            for _ in $(seq 1 60); do
              if (exec 3<>/dev/tcp/127.0.0.1/"$1") 2>/dev/null; then exec 3<&- ; return 0; fi
              sleep 0.5
            done
            return 1
          }
          for p in 3211 3214 3500 3501; do
            wait_port "$p" || { echo "端口 $p 未就绪"; exit 1; }
          done
          # 端口通了还不够，确认应用真的能应答
          curl -fsS http://127.0.0.1:3211/api/health >/dev/null || { echo '3211 健康检查失败'; exit 1; }
          curl -fsS http://127.0.0.1:3214/api/health >/dev/null || { echo '3214 健康检查失败'; exit 1; }

      - name: 请求头清洗回归
        run: node scripts/check-forward-headers.mjs
      - name: 超时与重试回归
        run: node scripts/check-proxy-timeout.mjs
      - name: DNS rebinding 防护回归
        run: node scripts/check-rebind.mjs

      - name: 服务日志
        if: failure()
        run: |
          for f in /tmp/app-3211.log /tmp/app-3214.log /tmp/fixtures.log /tmp/ws-echo.log; do
            echo "----- $f"; tail -40 "$f" 2>/dev/null || true
          done

  # ---------------------------------------------------------------
  # 3) 浏览器回归：真实 Chrome + 全套夹具
  #    覆盖存储隔离、WS 隧道、导航死循环、续跑、面板、停止、工具别名
  # ---------------------------------------------------------------
  browser:
    name: 浏览器回归
    runs-on: ubuntu-latest
    needs: syntax
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: 安装 Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
      # chrome.mjs 会优先读 CHROME_PATH
      - run: echo "CHROME_PATH=${{ steps.setup-chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"

      - name: 启动服务
        run: |
          set -u
          ALLOW_LOCALHOST=true PORT=3211 node server/index.js >/tmp/app-3211.log 2>&1 &
          # 只需一个 mock LLM：它占用 MOCK_PORT 与 MOCK_PORT+1 两个端口 ——
          # 3400 是模型接口，3401 是 /__log、/__reset 日志接口（续跑回归读它）。
          # 不要为了「隔离日志」再起一个 MOCK_PORT=3401 的实例：两个实例的端口区间
          # 会重叠，后起的会抢占前一个的日志端口，导致前一个崩溃、3400 连不上。
          MOCK_PORT=3400 node scripts/mock-llm.mjs >/tmp/mock-3400.log 2>&1 &
          node scripts/fixtures/fixtures-server.mjs >/tmp/fixtures.log 2>&1 &
          node scripts/fixtures/ws-echo-server.mjs >/tmp/ws-echo.log 2>&1 &

          wait_port() {
            for _ in $(seq 1 60); do
              if (exec 3<>/dev/tcp/127.0.0.1/"$1") 2>/dev/null; then exec 3<&- ; return 0; fi
              sleep 0.5
            done
            return 1
          }
          for p in 3211 3400 3401 3500 3501; do
            wait_port "$p" || { echo "端口 $p 未就绪"; exit 1; }
          done
          curl -fsS http://127.0.0.1:3211/api/health >/dev/null || { echo '应用健康检查失败'; exit 1; }

      - name: 存储隔离回归
        run: node scripts/check-storage.mjs
      - name: 存储保真度回归
        run: node scripts/check-storage-fidelity.mjs
      - name: WebSocket 隧道回归
        run: node scripts/check-ws.mjs
      - name: 导航死循环保护回归
        run: node scripts/check-nav-loop.mjs
      - name: 跨页面续跑回归
        run: node scripts/check-resume.mjs
      - name: 面板关闭与恢复回归
        run: node scripts/check-panel-close.mjs
      - name: 停止即断回归
        run: node scripts/check-stop.mjs
      - name: 工具名别名回归
        run: node scripts/check-tool-alias.mjs

      - name: 服务日志
        if: failure()
        run: |
          for f in /tmp/app-3211.log /tmp/mock-3400.log /tmp/fixtures.log /tmp/ws-echo.log; do
            echo "----- $f"; tail -40 "$f" 2>/dev/null || true
          done

  # ---------------------------------------------------------------
  # 4) 镜像构建 + 容器健康检查：确认 Dockerfile 真能跑起来
  # ---------------------------------------------------------------
  docker:
    name: 镜像构建与健康检查
    runs-on: ubuntu-latest
    needs: syntax
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: web-agent-pilot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 启动容器
        run: |
          docker run -d --name wap -p 3000:3000 -e ALLOW_LOCALHOST=false web-agent-pilot:ci
      - name: 等待健康检查通过
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' wap)
            echo "health=$status"
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          echo '健康检查未通过，容器日志：'
          docker logs wap
          exit 1
      - name: 容器日志
        if: failure()
        run: docker logs wap || true
